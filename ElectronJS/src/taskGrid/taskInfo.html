<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="X-UA-Compatible" content="ie=edge"><script src="jquery-3.4.1.min.js"></script><script src="vue.js"></script><link rel="stylesheet" href="bootstrap/css/bootstrap.css"><title>Task Details | EasySpider</title><link rel="stylesheet" href="workspace-ui.css"></head><body>
<div id="taskInfo" class="workspace-shell"><aside class="side-rail"><div class="brand"><svg class="brand-wave" viewBox="0 0 42 28" fill="none" aria-hidden="true"><path d="M2 7c7-5 12-5 19-1s12 4 19-1M2 14c7-5 12-5 19-1s12 4 19-1M2 21c7-5 12-5 19-1s12 4 19-1" stroke="currentColor" stroke-width="1.7"/></svg><div><p class="brand-name">EasySpider</p><p class="brand-caption">{{"Automation workspace~自动化工作台" | lang}}</p></div></div><nav class="rail-nav" :aria-label="'Workspace navigation~工作区导航' | lang"><button type="button" class="rail-item" @click="gotoHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/></svg><span>{{"Task List~任务列表" | lang}}</span></button><div class="rail-item is-active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12-4-4L4 15zM13 20h8"/></svg><span>{{"Task Details~任务详情" | lang}}</span></div></nav><div class="rail-support"><a href="https://github.com/NaiboWang/EasySpider/wiki" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7a3 3 0 0 1 3 3v14a3 3 0 0 0-3-3H4zM14 7a3 3 0 0 1 3-3h3v14h-3a3 3 0 0 0-3 3"/></svg>{{"Documentation~使用文档" | lang}}</a><a href="https://github.com/NaiboWang/EasySpider/issues?q=is%3Aissue" target="_blank" rel="noopener noreferrer">{{"Questions and feedback~问题反馈" | lang}}</a></div></aside><main class="workspace-main">
    <header class="topbar"><button type="button" class="back-link" @click="gotoHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>{{"Back to task list~返回任务列表" | lang}}</button><span class="topbar-label">{{"Task Details~任务详情" | lang}}</span></header>
    <template v-if="show"><header class="page-heading"><div><h1>{{"Task Details~任务详情" | lang}}</h1><p>{{"Task ID~任务 ID" | lang}} {{task.id}}</p></div><div class="inline-actions"><button type="button" class="secondary-action" @click="modifyTask(task.id,task.url)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4 5 5M4 20l4-1 12-12-4-4L4 15zM13 20h8"/></svg>{{"Modify Task~修改任务" | lang}}</button><button type="button" class="primary-action" @click="invokeTask(task.id,task.url)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>{{"Execute Task~执行任务" | lang}}</button></div></header>
    <section class="content"><section class="sheet"><div class="sheet-body summary-grid"><div class="task-summary"><h2>{{task.name}}</h2><p v-if="task.desc" class="task-description">{{task.desc}}</p><p v-else class="task-description">{{"No description~暂无描述" | lang}}</p><a class="task-address" :href="task.url" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7M21 3 11 13M10 5H4v15h15v-6"/></svg><span>{{task.url}}</span></a><p class="help">{{"To edit the workflow with a browser, close this window and choose Design Task on the startup screen.~如需在浏览器中修改任务流程，请关闭此窗口，从启动首页进入“设计/修改任务”。" | lang}}</p></div><dl class="task-metadata"><div><dt>{{(task.create_time ? "Created~创建时间" : task.file_create_time ? "Created (file record)~创建时间（文件记录）" : "Created~创建时间") | lang}}</dt><dd>{{task.create_time ? dateFormat(task.create_time) : (task.file_create_time ? dateFormat(task.file_create_time) : '—')}}</dd></div><div><dt>{{"Updated~更新时间" | lang}}</dt><dd>{{task.update_time ? dateFormat(task.update_time) : (task.mtime ? dateFormat(task.mtime) : '—')}}</dd></div></dl></div></section>
        <section class="sheet parameter-section"><header class="sheet-heading"><h2>{{"Input Parameters~输入参数" | lang}}<span class="count">{{(task.inputParameters || []).length}}</span></h2></header><div class="table-scroll"><table class="parameter-table"><thead><tr><th class="id-cell" scope="col">ID</th><th scope="col">{{"Parameter Name~参数名称" | lang}}</th><th scope="col">{{"Invoke Name~调用名称" | lang}}</th><th scope="col">{{"Type~类型" | lang}}</th><th scope="col">{{"Example Value~示例值" | lang}}</th><th scope="col">{{"Description~描述" | lang}}</th></tr></thead><tbody><tr v-for="(parameter,index) in (task.inputParameters || [])" :key="index"><td class="id-cell">{{index+1}}</td><td>{{parameter.nodeName}}</td><td class="code-cell">{{parameter.name}}</td><td>{{parameter.type}}</td><td>{{parameter.exampleValue}}</td><td>{{parameter.desc}}</td></tr><tr v-if="!(task.inputParameters || []).length"><td colspan="6" class="empty-cell">{{"This task has no input parameters.~此任务没有输入参数。" | lang}}</td></tr></tbody></table></div></section>
        <section class="sheet parameter-section"><header class="sheet-heading"><h2>{{"Output Parameters~输出参数" | lang}}<span class="count">{{(task.outputParameters || []).length}}</span></h2></header><div class="table-scroll"><table class="parameter-table"><thead><tr><th class="id-cell" scope="col">ID</th><th scope="col">{{"Parameter Name~参数名称" | lang}}</th><th scope="col">{{"Type~类型" | lang}}</th><th scope="col">{{"Example Value~示例值" | lang}}</th><th scope="col">{{"Description~描述" | lang}}</th><th scope="col">{{"Save as a field~作为字段保存" | lang}}</th></tr></thead><tbody><tr v-for="(parameter,index) in (task.outputParameters || [])" :key="index"><td class="id-cell">{{index+1}}</td><td>{{parameter.name}}</td><td>{{parameter.type}}</td><td>{{parameter.exampleValue}}</td><td>{{parameter.desc}}</td><td>{{(parameter.recordASField == 1 ? "Yes~是" : "No~否") | lang}}</td></tr><tr v-if="!(task.outputParameters || []).length"><td colspan="6" class="empty-cell">{{"This task has no output parameters.~此任务没有输出参数。" | lang}}</td></tr></tbody></table></div></section>
    </section></template><section v-else class="content"><p class="notice" role="status">{{"Loading task details…~正在加载任务详情…" | lang}}</p></section>
</main></div></body></html>
<script src="global.js"></script>
<script>
    var sId = getUrlParam('id');
    var app = new Vue({
        el: '#taskInfo',
        data: {
            task: {},
            show: false, //是否渲染
            backEndAddressServiceWrapper: getUrlParam("backEndAddressServiceWrapper"),
        },
        methods: {
            dateFormat: DateFormat,
            gotoHome: function () {
                let url = "";
                if (getUrlParam("lang") == "zh") {
                    url = "taskList.html?lang=zh&type=" + getUrlParam("type") + "&wsport=" + getUrlParam("wsport") + "&backEndAddressServiceWrapper=" + app.$data.backEndAddressServiceWrapper
                } else {
                    url = "taskList.html?lang=en&type=" + getUrlParam("type") + "&wsport=" + getUrlParam("wsport") + "&backEndAddressServiceWrapper=" + app.$data.backEndAddressServiceWrapper
                }
                window.location.href = url;
            },
            modifyTask: function (id, url) {
                let message = { //显示flowchart
                    type: 1, //消息类型，传递链接
                    message: {
                        "id": id,
                    }
                };
                // ws.send(JSON.stringify(message));
                // window.location.href = url; //跳转链接
                if (getUrlParam("lang") == "zh") {
                    window.location.href = "FlowChart_CN.html?type=" + getUrlParam("type") + "&lang=" + getUrlParam("lang") + "&id=" + id + "&wsport=" + getUrlParam("wsport") + "&backEndAddressServiceWrapper=" + app.$data.backEndAddressServiceWrapper
                } else {
                    window.location.href = "FlowChart.html?type=" + getUrlParam("type") + "&lang=" + getUrlParam("lang") + "&id=" + id + "&wsport=" + getUrlParam("wsport") + "&backEndAddressServiceWrapper=" + app.$data.backEndAddressServiceWrapper
                }

            },
            invokeTask: function (id) {
                window.location.href = "executeTask.html?type=" + getUrlParam("type") + "&lang=" + getUrlParam("lang") + "&id=" + id + "&wsport=" + getUrlParam("wsport") + "&backEndAddressServiceWrapper=" + app.$data.backEndAddressServiceWrapper;
            },
        }
    });
    $.get(app.$data.backEndAddressServiceWrapper + "/queryTask?id=" + sId, function (result) {
        app.$data.task = result;
        app.$data.show = true;
    });
</script>
